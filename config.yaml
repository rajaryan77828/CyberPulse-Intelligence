# CyberPulse Intelligence Source Registry & Configuration

app:
  name: "CyberPulse Intelligence"
  version: "1.0.0"
  tagline: "Local Cybersecurity Threat Intelligence Aggregation Platform"
  author: "RAJ ARYAN"
  website: "https://rajaryan.neocities.org"
  bind_address: "127.0.0.1"
  port: 8501
  db_path: "data/cyberpulse.db"
  backup_dir: "backups"
  exports_dir: "exports"
  logs_dir: "logs"
  daily_target: 1000
  retention_days: 90
  request_timeout_seconds: 12
  max_concurrent_workers: 10
  user_agent: "CyberPulse-Intelligence/1.0 (+https://github.com/cyberpulse; bot/threat-intel; local-user)"
  max_response_bytes: 2097152 # 2MB

# Background Auto-Fetch Scheduler Configuration
scheduler:
  enabled: true
  interval_seconds: 300      # Fetch cycle every 5 minutes
  source_cooldown_seconds: 120  # Min seconds between fetching the same source
  max_backoff_seconds: 300    # Cap exponential backoff at 5 minutes
  max_retries_per_source: 3   # Max retry attempts per source per cycle
  ui_refresh_seconds: 30      # How often the status panel auto-refreshes
  stale_threshold_multiplier: 2  # Consider stale if last fetch > interval × this

categories:
  - "Global News"
  - "Vulnerabilities"
  - "CVE & NVD"
  - "Ransomware"
  - "Malware"
  - "Data Breaches"
  - "Threat Intelligence"
  - "Exploits & PoC"
  - "Cloud Security"
  - "Application Security"
  - "Network Security"
  - "AI Security"
  - "Phishing & Social Engineering"
  - "Privacy & Compliance"
  - "Vendor Advisories"

